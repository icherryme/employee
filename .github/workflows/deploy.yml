name: Java CI with Maven

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupération du code source
      - name: Vérification du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configuration de Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Configuration de Java 21 (Requis par SonarQube)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. Compilation, Tests & SonarQube
      - name: Build, Test & Sonar Analysis
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          mvn clean verify sonar:sonar \
          -Dspring.datasource.url="${{ secrets.DB_URL }}" \
          -Dspring.datasource.username="${{ secrets.DB_USERNAME }}" \
          -Dspring.datasource.password="${{ secrets.DB_PASSWORD }}" \
          -Dsonar.token="${{ secrets.SONAR_TOKEN }}" \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=icherryme \
          -Dsonar.projectKey=icherryme_employee